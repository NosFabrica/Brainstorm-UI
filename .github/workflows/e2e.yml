name: E2E (staging)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    name: Smoke against staging
    runs-on: ubuntu-latest
    environment: staging-e2e
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://brainstorm-staging.nosfabrica.com' }}
          E2E_TEST_NSEC: ${{ secrets.E2E_TEST_NSEC }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
