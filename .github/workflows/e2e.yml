name: E2E (staging)

on:
  workflow_dispatch:
  # staging -> main: the release candidate, which is what staging runs.
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  # A merge into staging (the default branch), once staging serves it. Not on
  # the PR into staging: staging doesn't run the PR's code until it merges, so
  # the PR's own specs would be checked against the build before it.
  push:
    branches: [staging]

concurrency:
  group: e2e-staging-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Smoke against staging
    runs-on: ubuntu-latest
    environment: staging-e2e
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # build.yml builds this commit's image with BUILD_ID = the commit, and the
      # cluster rolls it out after; the service worker names its cache by it.
      - name: Wait for staging to serve this commit
        if: github.event_name == 'push'
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL || 'https://brainstorm-staging.nosfabrica.com' }}
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 15 "$BASE_URL/sw.js" | grep -q "brainstorm-${GITHUB_SHA}"; then
              echo "staging serves ${GITHUB_SHA}"
              exit 0
            fi
            sleep 30
          done
          echo "staging did not serve ${GITHUB_SHA} within 30 minutes"
          exit 1

      - name: Run e2e
        run: npm run e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://brainstorm-staging.nosfabrica.com' }}
          E2E_TEST_NSEC: ${{ secrets.E2E_TEST_NSEC }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
