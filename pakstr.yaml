# pakstr.yaml — one file, one command, one APK.
# Generated by `pakstr init`. Edit freely.
#
# ⚠️  Keep your nsec OUT of this file. `pakstr init` wrote a local dev nsec
# to .env (gitignored). For real releases, put PAKSTR_NSEC in your CI
# secret manager — reuse the same nsec so updates install over prior APKs.
# WARNING: PAKSTR_NSEC is a production release-signing root secret. Anyone who
# has it can derive every app identity for every known appId. Losing it breaks
# update continuity. It cannot rotate the signer of an already-published app.
#
# Prod APK, built and published by CI (build.yml) on every push to main.

app:
  appId: world.brainstorm.app # REQUIRED. Java package id; also feeds key derivation.
  appName: "Brainstorm" # REQUIRED. Launcher label.
  # Using auto requires a stable SemVer Git tag pointing exactly at HEAD.
  # CI writes both from the commit count on main; these are for local dry runs.
  versionName: "0.0.0" # REQUIRED. Human-readable version.
  versionCode: 1 # REQUIRED. Monotonic integer.
  description: "Build trust scores from your own connections — not an algorithm. The decentralized Web of Trust layer for Nostr." # OPTIONAL.
  icon: ./dist/icons/icon-512.png # OPTIONAL. Resolved relative to this file.
  # splash:                          # OPTIONAL.
  #   image: ./splash.png
  #   background: "#0f0f17"
  backgroundColor: "#ffffff" # OPTIONAL. Launcher icon background.
  permissions: ["INTERNET"] # OPTIONAL. Aliases (case-insensitive): INTERNET, CAMERA, NOTIFICATIONS, VIBRATE.

build:
  web: ./dist # REQUIRED. Built web assets (must contain index.html).
  out: ./build/brainstorm.apk # OPTIONAL. Default ./build/<appId>.apk
  builder: docker # Only "docker" is specified.

# runtime:
#   apiBase: https://api.example.com  # OPTIONAL. Enables the packaged /api/* proxy.

publish:
  upload:
    provider: blossom
    server: https://cdn.zapstore.dev

  zapstore:
    enabled: true # Set false to upload without Zapstore events.
    source: upload
    # source: https://downloads.example.com/my-app.apk  # Or an absolute public APK URL.

  nsite:
    enabled: false
    relays:
      - wss://nostr.cercatrova.me
      - wss://relay.primal.net
      - wss://nos.lol
      - wss://relay.damus.io
    servers:
      - https://cdn.hzrd149.com
      - https://cdn.sovbit.host
      - https://cdn.nostrcheck.me
      - https://nostr.download
    publishProfile: false # Publishes only when explicit profile data is added.
    publishRelayList: false
    publishServerList: false

  relay: wss://relay.zapstore.dev
  # publishKey: PAKSTR_PUBLISH_NSEC  # OPTIONAL. Omit to reuse PAKSTR_NSEC for publishing.

  # Gitea Release alternative: replace the active Blossom upload block above
  # with this block. Keep the token itself in the environment, never this file.
  # upload:
  #   provider: gitea-release
  #   baseUrl: https://git.example.com
  #   owner: your-org
  #   repo: your-app
  #   tokenEnv: PAKSTR_GITEA_TOKEN
  #   tag: "v{versionName}"
  #   assetName: "{appId}-{versionName}.apk"
  #   prerelease: false
