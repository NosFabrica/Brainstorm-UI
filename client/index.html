<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- No-flash theme: set class="dark" synchronously before first paint.
         Honors an explicit "dark" choice, and "system" when the OS prefers dark.
         Fresh visitors (no stored choice) stay LIGHT — we don't auto-dark a
         dark-OS visitor until dark mode is fully reviewed. When ready to make it
         the default, change to: `t === 'dark' || ((!t || t === 'system') && …)`. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("brainstorm_theme");
          var osDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (t === "dark" || (t === "system" && osDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <title>Brainstorm - Web of Trust for Nostr</title>
    <meta name="description" content="Build trust scores from your own connections — not an algorithm. Brainstorm is the decentralized Web of Trust layer for Nostr." />
    <meta name="keywords" content="Brainstorm, Nostr, Web of Trust, WoT, GrapeRank, decentralized, trust scores, social graph, NIP-85, reputation" />
    <meta name="author" content="Brainstorm" />
    <meta name="theme-color" content="#0a0e18" />

    <link rel="canonical" href="https://brainstorm.nosfabrica.com/" />

    <meta property="og:title" content="Brainstorm — Your Network. Your Rules." />
    <meta property="og:description" content="Build trust scores from your own connections — not an algorithm. The decentralized Web of Trust layer for Nostr." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brainstorm.nosfabrica.com/" />
    <meta property="og:image" content="https://brainstorm.nosfabrica.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Brainstorm — Search through the people you trust." />
    <meta property="og:site_name" content="Brainstorm" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brainstorm — Your Network. Your Rules." />
    <meta name="twitter:description" content="Build trust scores from your own connections — not an algorithm. The decentralized Web of Trust layer for Nostr." />
    <meta name="twitter:image" content="https://brainstorm.nosfabrica.com/og-image.png" />
    <meta name="twitter:image:alt" content="Brainstorm — Search through the people you trust." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Home-screen name. iOS has no manifest fallback for the icon label — it
         uses the <title>, which is "Brainstorm - Web of Trust for Nostr" and got
         truncated to "Brainstorm-We…" under the icon. This meta is the only thing
         iOS honours; the manifest's short_name covers Android/Chrome. -->
    <meta name="apple-mobile-web-app-title" content="Brainstorm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="/config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Brand fonts only (Design System v1.0): Figtree (interface) + IBM Plex Mono (technical/metadata). -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
