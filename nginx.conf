# Thumbnail requests are keyed per client IP. A results page asks for ~100 at
# once, which is what the burst covers; a scraper walking URLs is not.
limit_req_zone $binary_remote_addr zone=img:10m rate=20r/s;
# Concurrency, not rate: a miss holds a source download open, up to the 32MB
# cap. A browser uses ~6 connections per host, so this only bites a flood.
limit_conn_zone $binary_remote_addr zone=img_conn:10m;

# /github/ and /openlibrary/ (below): third-party JSON, proxied so a reader's
# browser never contacts those sites, and cached here because GitHub allows an
# unauthenticated caller 60 requests an hour, and every reader's request leaves
# from the same address. A book's or account's page asks a handful at once, and a
# list of them asks per row, hence the burst.
limit_req_zone $binary_remote_addr zone=lookup:10m rate=10r/s;
proxy_cache_path /var/cache/nginx/lookups levels=1:2 keys_zone=lookups:10m max_size=50m inactive=7d use_temp_path=off;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No version in Server or on error pages.
    server_tokens off;

    # The Content-Security-Policy, X-Frame-Options, nosniff, Referrer-Policy,
    # Permissions-Policy and HSTS every response carries. docker-entrypoint.sh
    # writes the file at start: the policy names the page's inline scripts by
    # hash, and the inline config is only known then (CSP_MODE switches it to
    # report-only). nginx gives a location that sets any add_header of its own
    # NONE of these, so every such location below includes the file again
    # (test/securityHeaders.test.ts holds them to it).
    include /etc/nginx/security-headers.conf;

    # Resolver address is substituted at container start from the first
    # nameserver in /etc/resolv.conf — 127.0.0.11 under compose, the kube-dns
    # ClusterIP in k8s. Resolving at request time (via a variable in
    # proxy_pass) is what lets nginx boot when brainstorm-og is absent.
    #
    # nginx does NOT apply resolv.conf's `search` domains, so OG_UPSTREAM must
    # be fully qualified under Kubernetes. The chart supplies the FQDN.
    resolver ${OG_RESOLVER} valid=30s ipv6=off;

    # Hashed assets — immutable.
    #
    # `^~` so the extension deny-list further down cannot outrank this prefix.
    # Without it a hashed /assets/*.json or *.xml matches that regex instead and
    # silently loses its Cache-Control, while still being served.
    #
    # One Cache-Control, written out: `expires` would add a second one (and an
    # Expires) beside it. Not `always`: in a rolling deploy a new page can ask an
    # old pod for a chunk it doesn't have yet, and that 404 must not be kept for
    # a year.
    #
    # `gzip_static`: the Dockerfile writes a .gz beside each JS, CSS, SVG and wasm
    # file at build, at gzip's best level, so nginx sends that rather than
    # compressing on every request at the level a request can afford. Only here:
    # the HTML and config.js are rewritten at container start (docker-
    # entrypoint.sh), and a .gz written at build would go stale beside them.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # public/'s art: brand images, icons, launch screens, store screenshots. Not
    # hashed, so not immutable; but a deploy rarely changes them, and with no
    # Cache-Control at all a browser revalidated each one on every page. A day
    # fresh, then up to a week served from cache while it revalidates behind.
    # Their mtimes are pinned at build (Dockerfile), so the ETag a revalidation
    # sends still matches after a deploy that left the file alone.
    #
    # `^~` for the reason /assets/ has it. A missing file is a 404, never the SPA:
    # an <img> handed a page of HTML is a broken image either way, and a 404 says so.
    location ^~ /brand/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }
    location ^~ /icons/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }
    location ^~ /splash/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }
    location ^~ /screenshots/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # Built on Brainstorm (docs/built-on-brainstorm.md): the element apps copy, the look every
    # copy loads, and a page that previews it. Other sites fetch these, so they are cached for an
    # hour (a restyle reaches every app within it) and open to any origin, and a missing file is
    # a 404, never the SPA. `^~` for the reason /assets/ has it.
    location ^~ /built-on/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
    }

    # ---- Site trust signals -------------------------------------------------
    # ACME HTTP-01 challenges are exempt from every rule below. cluster-issuers
    # .yaml uses an http01 solver, so cert-manager answers
    # /.well-known/acme-challenge/<token> over plain HTTP; a 404 there fails
    # certificate issuance AND renewal, silently, until TLS expires on every
    # host at once. `^~` so this prefix wins outright over the regex locations
    # further down (nginx stops looking once a `^~` prefix match is found).
    #
    # Today the challenge is resolved above this container by cert-manager's
    # solver Ingress, so this block changes nothing. It exists so that a future
    # change in how challenges are routed cannot be broken by the rules below.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # Both documents are real files on disk (robots.txt and the Canonical lines
    # of security.txt are written by docker-entrypoint.sh at container start).
    # Exact matches, so they are resolved before any regex below is consulted.
    location = /robots.txt {
        charset utf-8;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        charset utf-8;
        try_files $uri =404;
    }

    # /bot — the disclosure page named in our fetcher's User-Agent
    # (BrainstormBot/1.0 (+https://brainstorm.world/bot)). A webmaster reading
    # it has our request in their logs and wants to know who we are, so it is a
    # real file with no JavaScript rather than an SPA route: an automated
    # reviewer that renders nothing must still be able to read it.
    #
    # Exact match, so it outranks every regex below and the SPA fallback, and
    # the extension deny-list never sees it. The extensionless /bot is what the
    # UA advertises; /bot.html is the file behind it and stays reachable under
    # its own name via the SPA fallback's try_files, which is harmless — the
    # page carries `robots: noindex`, so two live URLs cost nothing.
    location = /bot {
        charset utf-8;
        try_files /bot.html =404;
    }
    # -------------------------------------------------------------------------

    # Share cards. Not gated on User-Agent: X's image fetcher sends a different
    # UA than its card fetcher, and humans never request these anyway.
    #
    # `^~` for the same reason /assets/ has it: an unmodified prefix loses to
    # any matching regex, so the deny-list below would intercept a share-card
    # URL ending in a listed extension before this proxy ever saw it.
    location ^~ /og/ {
        set $og_upstream ${OG_UPSTREAM};
        proxy_pass http://$og_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        # Left at 502/503/504 on purpose, unlike /__og/ below. These URLs are
        # image requests: answering a missing card with a page of HTML would
        # hand the fetcher a broken image rather than an honest 404.
        error_page 502 503 504 = @spa;
    }

    # Link previews, fetched by the SPA for a URL inside a note. Same origin as
    # the app, so no CORS and no base-URL env var to plumb; the service path and
    # the public path are identical, so the URI passes through unchanged.
    #
    # `^~` for the reason /assets/ and /og/ have it: an unmodified prefix loses
    # to any matching regex. No regex below matches this path today — nginx
    # strips the query before matching, so the ?url= never enters into it — so
    # this is defence against a regex added later, on the same terms as its
    # neighbours.
    #
    # X-Forwarded-For is forwarded here and nowhere else on this upstream
    # because the service rate-limits per client IP, counting hops from the
    # right. Drop this line and every caller collapses into one bucket.
    location ^~ /link-preview {
        include /etc/nginx/security-headers.conf;
        set $og_upstream ${OG_UPSTREAM};
        proxy_pass http://$og_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        # The Android APK serves the app from 127.0.0.1:8080 and asks here cross-origin.
        add_header Access-Control-Allow-Origin "http://127.0.0.1:8080" always;
        # Unlike every neighbouring path here, this must NOT fall back to the
        # SPA: the caller is a fetch() expecting JSON, and a page of HTML fails
        # in it as a parse error rather than as a preview we could not build.
        error_page 502 503 504 = @preview_down;
    }

    # Thumbnails (imgproxy). Its own errors reach the SPA; only an unreachable proxy redirects to the original.
    location ^~ /img/ {
        # Our own pages only. `none` stays allowed: privacy extensions strip
        # Referer, and those readers are not the abuse case.
        valid_referers none server_names ${IMG_REFERER_HOSTS};
        if ($invalid_referer) { return 403; }

        # Written by the entrypoint, empty unless IMG_TRUSTED_CIDR is set:
        # without it every caller keys on the ingress pod's address and the
        # limit below is one global bucket.
        include /etc/nginx/img-realip.conf;

        limit_req zone=img burst=200 nodelay;
        limit_req_status 429;
        limit_conn img_conn 20;
        limit_conn_status 429;

        set $img_upstream ${IMG_UPSTREAM};
        proxy_pass http://$img_upstream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        error_page 502 504 = @img_original;
    }

    # Only ever an <img> falling back to its own source. A typed or clicked link
    # sends Sec-Fetch-Dest: document, and must not get a redirect: the upstream
    # is unresolvable wherever the proxy isn't deployed, so every /img/ URL
    # reaches here and this would otherwise be an open redirect on our domain.
    # `[^\s]` keeps a decoded %0D%0A out of Location; `/+` survives merge_slashes.
    location @img_original {
        if ($http_sec_fetch_dest !~ "^(image|empty|)$") {
            return 404;
        }
        # Browsers too old to send Sec-Fetch-Dest still ask for a page with
        # Accept: text/html and for a picture without it.
        if ($http_accept ~* "text/html") {
            return 404;
        }
        if ($uri ~* "^/img/[^/]+/[^/]+/plain/(https?):/+([^\s]+)$") {
            return 302 $1://$2;
        }
        return 404;
    }

    # GitHub's public API (services/github): an account's page asks our origin,
    # never api.github.com. Open Library the same (services/openLibrary). The dev
    # server proxies the same paths (vite.config.ts).
    #
    # `^~` so the deny-list can't take them: Open Library's paths end in .json,
    # which that regex would answer with a 404. Only the paths the app asks for go
    # upstream; anything else is a 404 here, so neither is a general-purpose proxy
    # onto that site.
    #
    # Cached here (proxy_cache_path above) whatever the upstream's own headers say:
    # GitHub marks its answers fresh for 60 seconds, against a limit of 60 requests
    # an hour per address. A missing account or book is cached for an hour. When
    # the upstream errors, times out or refuses us (403/429: GitHub's rate limit),
    # the last good copy is served instead. `lock` folds a crowd of readers missing
    # on one URL into one upstream request.
    #
    # Resolved at request time through the resolver above, like og, so nginx boots
    # when DNS is down. `Accept-Encoding` is cleared so the upstream answers
    # uncompressed and the cache holds one copy (gzip, below, compresses it on the
    # way out). The upstream's Vary goes with its Cache-Control: nothing here
    # varies but the encoding, and gzip_vary says that. Cookies and credentials
    # are stripped both ways. GET only; the rate limit keys per client as /img/'s
    # does.
    location ^~ /github/ {
        include /etc/nginx/security-headers.conf;
        if ($uri !~ "^/github/(?:users|gists)/") { return 404; }
        limit_except GET { deny all; }
        include /etc/nginx/img-realip.conf;
        limit_req zone=lookup burst=100 nodelay;
        limit_req_status 429;

        set $github_upstream api.github.com;
        rewrite ^/github(/.*)$ $1 break;
        proxy_pass https://$github_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "BrainstormBot/1.0 (+https://brainstorm.world/bot)";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;

        proxy_cache_valid 200 1d;
        proxy_cache lookups;
        proxy_cache_key $request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # The ISBN path answers with a redirect to the edition, at openlibrary.org.
    # `proxy_redirect` rewrites it onto this prefix, so the browser follows it back
    # here and never contacts Open Library itself. Redirects are cached too: an
    # ISBN's edition doesn't move.
    location ^~ /openlibrary/ {
        include /etc/nginx/security-headers.conf;
        if ($uri !~ "^/openlibrary/(?:isbn|works|books)/|^/openlibrary/api/books$") { return 404; }
        limit_except GET { deny all; }
        include /etc/nginx/img-realip.conf;
        limit_req zone=lookup burst=100 nodelay;
        limit_req_status 429;

        set $openlibrary_upstream openlibrary.org;
        rewrite ^/openlibrary(/.*)$ $1 break;
        proxy_pass https://$openlibrary_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host openlibrary.org;
        proxy_set_header User-Agent "BrainstormBot/1.0 (+https://brainstorm.world/bot)";
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_redirect https://openlibrary.org/ /openlibrary/;
        proxy_redirect http://openlibrary.org/ /openlibrary/;
        # Load-bearing, as for the bech32 redirects: nginx would otherwise make the
        # rewritten Location absolute, as http://<host>:3000/openlibrary/...
        absolute_redirect off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        proxy_cache_valid 200 301 302 1d;
        proxy_cache lookups;
        proxy_cache_key $request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ---- Regex locations: tried in FILE ORDER, first match wins -------------
    # Order below is load-bearing. Do not rearrange without re-reading each
    # comment.

    # Dotfiles and dot-directories (/.env, /.git/config, unhandled
    # /.well-known/*). No SPA route has a dot-prefixed segment.
    #
    # MUST stay above the extension deny-list. Both match /.env, and the one
    # written first wins: the extension rule's `try_files $uri =404` SERVES the
    # file when it exists, so with the order reversed the block written to keep
    # /.env private is the one that leaks it.
    #
    # Safe here because both escapes resolve earlier: security.txt is an exact
    # match, and acme-challenge is `^~` — neither reaches this regex.
    location ~ /\. {
        return 404;
    }

    # Share pages: profiles, notes (and articles, calendar events, places), short
    # share links. EVERY visitor gets the SPA with that page's own preview tags in
    # its <head>: index.html includes them from og (SSI, via /__og/ below), and
    # falls back to its generic tags when og has nothing to say or isn't there.
    #
    # Not split by User-Agent any more. A previewer we hadn't listed (Signal's,
    # iMessage's) got the generic card even for a profile, and there is no list
    # of what they send to keep up with. The tags are invisible to a person, and
    # the include costs one in-cluster round trip, cached in og.
    #
    # The regexes are load-bearing: `[^/]+` cannot cross a slash and `$` forbids
    # a suffix, so /p/{id}/hops and /p/{id}/{type} fall through to the plain SPA.
    # The id is captured and handed to og in the subrequest's path; og parses it
    # and answers 400 for anything that isn't one.
    #
    # Above the deny-list so an id can never be mistaken for a probe path. Ids
    # are bech32 (no dot) today, so this is defence in depth.
    #
    # `try_files /index.html` serves the page from THIS location, where `ssi` is
    # on. A fallback URI (`try_files $uri /index.html`) would redirect into
    # `location = /index.html`, which doesn't process includes.
    location ~ ^/p/([^/]+)/?$ {
        include /etc/nginx/security-headers.conf;
        set $share_meta /__og/meta/p/$1;
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/e/([^/]+)/?$ {
        include /etc/nginx/security-headers.conf;
        set $share_meta /__og/meta/e/$1;
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # `~*` is load-bearing: the QR payload is uppercase (PRD D4b), so a scan
    # arrives as /S/CODE. A case-sensitive rule would skip previews for exactly
    # the links most likely to be scanned and re-shared, and nothing would fail
    # loudly to say so. og folds the code's case itself.
    location ~* ^/s/([^/]+)/?$ {
        include /etc/nginx/security-headers.conf;
        set $share_meta /__og/meta/s/$1;
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # brainstorm.world/<bech32>, the njump shape: a person's id to /p/, an
    # event's (note, nevent, naddr) to /e/. A redirect rather than the SPA so the
    # link lands on the share page above, whose <head> carries og's tags. The SPA has
    # the same route (App.tsx, RootEntityRedirect) for dev and in-app links.
    #
    # The character class is bech32's alphabet, so `/nostr` or `/notes` is not
    # caught; `nostr:` in front is dropped, the way a pasted URI arrives. Above
    # the deny-list with the other id routes, though no bech32 has a dot.
    #
    # `~`, not `~*`: lowercase only. An all-caps id (a QR payload) falls through
    # to the SPA, which lowercases it, so /p/ and /e/ only ever see one spelling.
    #
    # `absolute_redirect off` is load-bearing: this server listens on 3000
    # behind a TLS-terminating ingress, so nginx's default absolute Location
    # would read http://<host>:3000/p/... A relative one resolves against the
    # URL the visitor actually used.
    location ~ ^/(?:nostr:)?((?:npub|nprofile)1[02-9ac-hj-np-z]+)/?$ {
        absolute_redirect off;
        return 301 /p/$1$is_args$args;
    }
    location ~ ^/(?:nostr:)?((?:note|nevent|naddr)1[02-9ac-hj-np-z]+)/?$ {
        absolute_redirect off;
        return 301 /e/$1$is_args$args;
    }

    # Probe and config-shaped paths must NOT fall through to the SPA. A host
    # that answers 200 to /.env and /wp-login.php reads to a reputation scanner
    # as a parked or cloned site.
    #
    # `try_files $uri =404` rather than a bare `return 404`: a regex location
    # takes over the request entirely, so a bare return would 404 a real file
    # with one of these extensions. This serves it if it exists, 404s if not —
    # what it must never do is fall back to index.html.
    #
    # `js`, `css`, `map`, and image extensions are deliberately absent. That
    # alone is not what protects /assets/ — a regex outranks an unmodified
    # prefix, so /assets/ and /og/ carry `^~` to stay out of reach entirely.
    location ~* \.(php|asp|aspx|jsp|cgi|sql|bak|ini|conf|sh|yml|yaml|env|json|xml|txt)$ {
        try_files $uri =404;
    }

    # Images at the root of public/ (favicons, the Apple icon, footer logos, the
    # share card): cached as /brand/ is, above. One segment only (`[^/]+`), so it
    # can't reach into a directory another location owns. Below the dotfile rule,
    # which must keep /.anything.png private; it shares no extension with the
    # deny-list, so the order between those two is moot. A missing one is a 404
    # rather than the SPA, as under /brand/.
    location ~* ^/[^/]+\.(?:png|webp|jpe?g|gif|svg|ico|avif)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }
    # -------------------------------------------------------------------------

    # The preview tags a share page includes: og's /meta/{p,e,s}/{id}, which is
    # the tags alone, no document. Only ever a subrequest (`internal`); `^~` so
    # no regex location can outrank it.
    #
    # Whatever goes wrong, the include must come back EMPTY: SSI uses the page's
    # generic tags (its `stub`) only when the subrequest outputs nothing, and
    # anything it does output lands in <head> verbatim — nginx's own "502 Bad
    # Gateway" page included. So every error og or nginx can produce goes to
    # @share_meta_none, which answers with no body:
    #   400  an id og cannot parse;  404  nothing to describe (not found, NSFW,
    #   deleted, unsupported kind) or an unknown short code;  500  og is up and
    #   broken (its logs show it; the page still works);  502/503/504  og isn't
    #   deployed, is down, or is slow.
    # proxy_intercept_errors is what lets error_page see og's own 400/404/500.
    #
    # A person's page waits on this, so it is bounded: one second over og's
    # profile budget (REQUEST_DEADLINE_SECS, 4s), so og's own partial answer
    # wins the race, and a page past it gets the generic tags. A cached card
    # answers in about a millisecond; a cold one is a relay read or two.
    location ^~ /__og/ {
        internal;
        set $og_upstream ${OG_UPSTREAM};
        rewrite ^/__og(/.*)$ $1 break;
        proxy_pass http://$og_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Plain text: the body is pasted into the page as it arrives.
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @share_meta_none;
    }
    location @share_meta_none {
        return 204;
    }
    location @spa {
        try_files /index.html =404;
    }

    # The service's own envelope shape, so a caller parses the outage the same
    # way it parses a page it could not fetch.
    location @preview_down {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        add_header Access-Control-Allow-Origin "http://127.0.0.1:8080" always;
        return 503 '{"code":503,"message":"link preview unavailable","data":null}';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html, and the share pages above that serve it: revalidated on every
    # load, so a deploy propagates at once. `no-cache`, not `no-store`: the
    # freshness is the same, and `no-store` also kept the page out of the back/
    # forward cache and from ever being answered with a 304.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # The installed app's moving parts: revalidated on every fetch, like
    # index.html. The service worker must be, or a deploy's new worker waits
    # on the HTTP cache; config.js is written at container start, so a cached
    # copy points at the last deploy's API and relays; the manifest is how an
    # installed app learns its new icons, shortcuts and name.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        include /etc/nginx/security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Compressed on the fly: the HTML, config.js, the manifest, the proxied JSON
    # above, whatever /assets/ has no .gz for (gzip_static). Level 6 rather than
    # nginx's default 1: ~15% smaller for little more CPU at these sizes.
    # `gzip_proxied any`: by default nginx sends a request that came through a
    # proxy (it carries Via, as corporate and carrier proxies' do) uncompressed,
    # the whole 2 MB entry included. `gzip_vary` tells such a proxy the answer
    # depends on Accept-Encoding, so it never hands one client's gzip to another
    # that can't read it. (text/html is always compressed; nginx refuses it in
    # this list.) Brotli would take about a third off JS and CSS again, but the
    # stock nginx image has no module for it: that is the ingress's to add.
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
        application/manifest+json application/wasm image/svg+xml image/x-icon font/ttf font/otf;
    gzip_min_length 1024;
}
