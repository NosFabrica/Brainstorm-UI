# Crawler User-Agents. Everything else is a human and gets the SPA.
map $http_user_agent $is_og_bot {
    default 0;
    "~*(facebookexternalhit|Twitterbot|Slackbot|Discordbot|TelegramBot|WhatsApp|LinkedInBot|Pinterest|redditbot|Applebot|bingbot|Googlebot|vkShare|Embedly|Iframely|Mastodon|Bluesky|Matrix|Synapse|SkypeUriPreview|DuckDuckBot|bot|crawler|spider|preview|unfurl)" 1;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver address is substituted at container start from the first
    # nameserver in /etc/resolv.conf — 127.0.0.11 under compose, the kube-dns
    # ClusterIP in k8s. Resolving at request time (via a variable in
    # proxy_pass) is what lets nginx boot when brainstorm-og is absent.
    #
    # nginx does NOT apply resolv.conf's `search` domains, so OG_UPSTREAM must
    # be fully qualified under Kubernetes. The chart supplies the FQDN.
    resolver ${OG_RESOLVER} valid=30s ipv6=off;

    # Required for the /p/ crawler path to fall back to the SPA. That path
    # already spends one error_page hop (418 -> @og); the 502 handler in @og is
    # a second, and nginx ignores it unless recursion is enabled. Without this
    # a crawler sees a raw 502 instead of the SPA whenever og is unreachable —
    # which is exactly the "safe when og is absent" property this design claims.
    recursive_error_pages on;

    # Hashed assets — immutable.
    #
    # `^~` so the extension deny-list further down cannot outrank this prefix.
    # Without it a hashed /assets/*.json or *.xml matches that regex instead and
    # silently loses its Cache-Control, while still being served.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Site trust signals -------------------------------------------------
    # ACME HTTP-01 challenges are exempt from every rule below. cluster-issuers
    # .yaml uses an http01 solver, so cert-manager answers
    # /.well-known/acme-challenge/<token> over plain HTTP; a 404 there fails
    # certificate issuance AND renewal, silently, until TLS expires on every
    # host at once. `^~` so this prefix wins outright over the regex locations
    # further down (nginx stops looking once a `^~` prefix match is found).
    #
    # Today the challenge is resolved above this container by cert-manager's
    # solver Ingress, so this block changes nothing. It exists so that a future
    # change in how challenges are routed cannot be broken by the rules below.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # Both documents are real files on disk (robots.txt and the Canonical lines
    # of security.txt are written by docker-entrypoint.sh at container start).
    # Exact matches, so they are resolved before any regex below is consulted.
    location = /robots.txt {
        charset utf-8;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        charset utf-8;
        try_files $uri =404;
    }
    # -------------------------------------------------------------------------

    # Share cards. Not gated on User-Agent: X's image fetcher sends a different
    # UA than its card fetcher, and humans never request these anyway.
    #
    # `^~` for the same reason /assets/ has it: an unmodified prefix loses to
    # any matching regex, so the deny-list below would intercept a share-card
    # URL ending in a listed extension before this proxy ever saw it.
    location ^~ /og/ {
        set $og_upstream ${OG_UPSTREAM};
        proxy_pass http://$og_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        # Left at 502/503/504 on purpose, unlike @og below. These URLs are
        # image requests: answering a missing card with a page of HTML would
        # hand the fetcher a broken image rather than an honest 404.
        error_page 502 503 504 = @spa;
    }

    # ---- Regex locations: tried in FILE ORDER, first match wins -------------
    # Order below is load-bearing. Do not rearrange without re-reading each
    # comment.

    # Dotfiles and dot-directories (/.env, /.git/config, unhandled
    # /.well-known/*). No SPA route has a dot-prefixed segment.
    #
    # MUST stay above the extension deny-list. Both match /.env, and the one
    # written first wins: the extension rule's `try_files $uri =404` SERVES the
    # file when it exists, so with the order reversed the block written to keep
    # /.env private is the one that leaks it.
    #
    # Safe here because both escapes resolve earlier: security.txt is an exact
    # match, and acme-challenge is `^~` — neither reaches this regex.
    location ~ /\. {
        return 404;
    }

    # Profiles — crawlers get server-rendered meta tags, humans get the SPA.
    #
    # The regex is load-bearing: `[^/]+` cannot cross a slash and `$` forbids a
    # suffix, so /p/{id}/hops and /p/{id}/{type} fall through to the SPA.
    #
    # Above the deny-list so a profile id can never be mistaken for a probe
    # path. Ids are bech32 (no dot) today, so this is defence in depth.
    #
    # error_page 418 avoids the "if + proxy_pass" pitfall inside a location
    # that also needs try_files.
    location ~ ^/p/[^/]+/?$ {
        error_page 418 = @og;
        if ($is_og_bot) { return 418; }
        try_files $uri $uri/ /index.html;
    }

    # Probe and config-shaped paths must NOT fall through to the SPA. A host
    # that answers 200 to /.env and /wp-login.php reads to a reputation scanner
    # as a parked or cloned site.
    #
    # `try_files $uri =404` rather than a bare `return 404`: a regex location
    # takes over the request entirely, so a bare return would 404 a real file
    # with one of these extensions. This serves it if it exists, 404s if not —
    # what it must never do is fall back to index.html.
    #
    # `js`, `css`, `map`, and image extensions are deliberately absent. That
    # alone is not what protects /assets/ — a regex outranks an unmodified
    # prefix, so /assets/ and /og/ carry `^~` to stay out of reach entirely.
    location ~* \.(php|asp|aspx|jsp|cgi|sql|bak|ini|conf|sh|yml|yaml|env|json|xml|txt)$ {
        try_files $uri =404;
    }
    # -------------------------------------------------------------------------

    location @og {
        set $og_upstream ${OG_UPSTREAM};
        proxy_pass http://$og_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        # If brainstorm-og isn't deployed or is down, crawlers get the SPA —
        # exactly the behaviour before this file existed. That is why no
        # enable flag is needed.
        #
        # 400 and 404 are here for a different reason: the id in /p/{id} is
        # attacker- and accident-supplied. og answers 400 for an id it cannot
        # parse and 404 for one it can parse but does not know, and neither was
        # caught, so a crawler following a truncated or stale profile link got
        # a bare upstream error instead of a card. Falling back to the SPA
        # gives it the generic Brainstorm card, which is the correct answer for
        # a profile we cannot describe.
        #
        # 500 is deliberately NOT here. That means og is up and broken, which
        # is a bug we want visible rather than silently papered over with a
        # generic card on every profile in the site.
        #
        # proxy_intercept_errors is REQUIRED for the 400/404 half to do
        # anything. 502/503/504 are synthesised by nginx when it cannot reach
        # the upstream, so error_page catches them either way — but a 400 or
        # 404 that og itself returned is an ordinary proxied response, and
        # nginx passes it straight through unless told to intercept.
        proxy_intercept_errors on;
        error_page 400 404 502 503 504 = @spa;
    }
    location @spa {
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html (deploys must propagate)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
